<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">equity-research workflow</title>
  <desc id="desc">Six steps: frame and budget, pin the security and clock, wide coverage sweep, go deep on leads, disconfirm the conclusion, synthesize and check consistency. Includes stop rules and depth budgets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; fill: #1f2937; }
      .h1 { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #64748b; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .st { font-size: 14px; font-weight: 700; }
      .b { font-size: 12px; }
      .s { font-size: 11.5px; fill: #475569; }
      .bt { font-size: 15px; font-weight: 700; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="500" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="499" rx="16" fill="none" stroke="#e2e8f0"/>

  <text class="t h1" x="30" y="44">Research workflow</text>
  <text class="t sub" x="30" y="66">Sweep wide first, dig where evidence is surprising or contradictory, then try to prove yourself wrong.</text>

  <!-- Step cards -->
  <g>
    <rect x="30" y="90" width="140" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="44" y="90" width="112" height="4" rx="2" fill="#2563eb"/>
    <circle cx="52" cy="120" r="12" fill="#2563eb"/><text class="t num" x="48" y="124">1</text>
    <text class="t st" x="70" y="118">Frame &amp;</text><text class="t st" x="70" y="135">budget</text>
    <text class="t b" x="42" y="164">8 request types</text>
    <text class="t s" x="42" y="182">deep dive · earnings</text>
    <text class="t s" x="42" y="198">price move · event</text>
    <text class="t s" x="42" y="214">theme · comparison</text>
    <text class="t s" x="42" y="230">macro · positioning</text>
    <text class="t b" x="42" y="254">→ depth + call budget</text>
  </g>
  <g>
    <rect x="182" y="90" width="140" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="196" y="90" width="112" height="4" rx="2" fill="#0891b2"/>
    <circle cx="204" cy="120" r="12" fill="#0891b2"/><text class="t num" x="200" y="124">2</text>
    <text class="t st" x="222" y="118">Pin security</text><text class="t st" x="222" y="135">&amp; clock</text>
    <text class="t b" x="194" y="164">code / ticker, market</text>
    <text class="t s" x="194" y="182">FY end · GAAP basis</text>
    <text class="t s" x="194" y="198">splits, listed subs</text>
    <text class="t b" x="194" y="222">latest results date</text>
    <text class="t s" x="194" y="240">what happened in the</text>
    <text class="t s" x="194" y="256">last few days?</text>
  </g>
  <g>
    <rect x="334" y="90" width="140" height="180" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="348" y="90" width="112" height="4" rx="2" fill="#0d9488"/>
    <circle cx="356" cy="120" r="12" fill="#0d9488"/><text class="t num" x="352" y="124">3</text>
    <text class="t st" x="374" y="118">Wide</text><text class="t st" x="374" y="135">sweep</text>
    <text class="t b" x="346" y="164">14 lenses, minimum</text>
    <text class="t b" x="346" y="180">check for each</text>
    <text class="t s" x="346" y="202">freshness sweep</text>
    <text class="t s" x="346" y="218">before "not found"</text>
    <text class="t s" x="346" y="240">market check gate:</text>
    <text class="t s" x="346" y="256">index · sector · peers</text>
  </g>
  <g>
    <rect x="486" y="90" width="140" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="500" y="90" width="112" height="4" rx="2" fill="#d97706"/>
    <circle cx="508" cy="120" r="12" fill="#d97706"/><text class="t num" x="504" y="124">4</text>
    <text class="t st" x="526" y="118">Go deep</text><text class="t st" x="526" y="135">on leads</text>
    <text class="t b" x="498" y="164">1. contradictions</text>
    <text class="t b" x="498" y="184">2. surprises</text>
    <text class="t b" x="498" y="204">3. high-impact</text>
    <text class="t b" x="514" y="220">unknowns</text>
    <text class="t b" x="498" y="240">4. 2nd-order effects</text>
    <text class="t s" x="514" y="256">on related cos</text>
  </g>
  <g>
    <rect x="638" y="90" width="140" height="180" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="652" y="90" width="112" height="4" rx="2" fill="#dc2626"/>
    <circle cx="660" cy="120" r="12" fill="#dc2626"/><text class="t num" x="656" y="124">5</text>
    <text class="t st" x="678" y="118">Disconfirm</text><text class="t st" x="678" y="135">yourself</text>
    <text class="t b" x="650" y="164">write the headline</text>
    <text class="t b" x="650" y="180">in one sentence</text>
    <text class="t s" x="650" y="202">search for the best</text>
    <text class="t s" x="650" y="218">evidence it is wrong</text>
    <text class="t s" x="650" y="240">check positioning,</text>
    <text class="t s" x="650" y="256">consensus, a peer</text>
  </g>
  <g>
    <rect x="790" y="90" width="140" height="180" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="804" y="90" width="112" height="4" rx="2" fill="#7c3aed"/>
    <circle cx="812" cy="120" r="12" fill="#7c3aed"/><text class="t num" x="808" y="124">6</text>
    <text class="t st" x="830" y="118">Synthesize</text><text class="t st" x="830" y="135">&amp; check</text>
    <text class="t b" x="802" y="164">priced-in view</text>
    <text class="t b" x="802" y="180">conditional scenarios</text>
    <text class="t s" x="802" y="202">consistency pass:</text>
    <text class="t s" x="802" y="218">tiers, figures, "see</text>
    <text class="t s" x="802" y="234">below", comparisons</text>
    <text class="t s" x="802" y="256">+ hygiene checklist</text>
  </g>

  <path class="line" d="M170 180 L180 180" marker-end="url(#arrow)"/>
  <path class="line" d="M322 180 L332 180" marker-end="url(#arrow)"/>
  <path class="line" d="M474 180 L484 180" marker-end="url(#arrow)"/>
  <path class="line" d="M626 180 L636 180" marker-end="url(#arrow)"/>
  <path class="line" d="M778 180 L788 180" marker-end="url(#arrow)"/>

  <!-- loop -->
  <path class="dash" d="M556 272 L556 292 Q556 300 548 300 L412 300 Q404 300 404 292 L404 276" marker-end="url(#arrow)"/>
  <text class="t s" x="420" y="318">new lead or contradiction → sweep the affected lenses again</text>

  <!-- Stop rules -->
  <rect x="30" y="340" width="430" height="136" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t bt" x="46" y="366">Stop rules</text>
  <text class="t b" x="46" y="392">• Two searches in a row add nothing new → stop the lead</text>
  <text class="t b" x="46" y="414">• Needs paid data → record the gap, suggest how to get it</text>
  <text class="t b" x="46" y="436">• Budget reached → write up, open items go to "Next"</text>
  <text class="t b" x="46" y="458">• Site fails → one alternative URL, then another source</text>

  <!-- Budgets -->
  <rect x="480" y="340" width="450" height="136" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t bt" x="496" y="366">Depth &amp; hard budget (searches + fetches)</text>
  <g>
    <text class="t b" x="496" y="392" font-weight="700">Quick</text><text class="t b" x="610" y="392">≤ 30</text><text class="t s" x="670" y="392">narrow question · ~300–600 words</text>
    <text class="t b" x="496" y="414" font-weight="700">Standard</text><text class="t b" x="610" y="414">≤ 80</text><text class="t s" x="670" y="414">default · ~1,000–2,000 words</text>
    <text class="t b" x="496" y="436" font-weight="700">Standard-wide</text><text class="t b" x="610" y="436">≤ 120</text><text class="t s" x="670" y="436">themes, comparisons</text>
    <text class="t b" x="496" y="458" font-weight="700">Deep</text><text class="t b" x="610" y="458">≤ 160</text><text class="t s" x="670" y="458">詳しく / full report · ~4,000 words</text>
  </g>
</svg>
