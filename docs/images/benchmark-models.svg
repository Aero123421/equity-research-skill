<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Held-out benchmark by model</title>
  <desc id="desc">Blind-graded usefulness out of 10 on four held-out stocks. Haiku 4.0 without the skill, 6.25 with. Sonnet 4.5 without, 8.0 with. Opus 6.0 without, 8.75 with. Rubric pass rate 49 percent without, 95 percent with.</desc>
  <defs>
    <style>
      .t { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; fill: #1f2937; }
      .h1 { font-size: 20px; font-weight: 700; }
      .sub { font-size: 12.5px; fill: #64748b; }
      .lab { font-size: 14px; font-weight: 700; }
      .k { font-size: 12px; fill: #475569; }
      .val { font-size: 12.5px; font-weight: 700; }
      .s { font-size: 11.5px; fill: #64748b; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="400" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="none" stroke="#e2e8f0"/>

  <text class="t h1" x="30" y="42">Held-out benchmark: usefulness by model (blind-graded, 1–10)</text>
  <text class="t sub" x="30" y="63">4 recent stocks (データセクション · キオクシア · CoreWeave · SpaceX) × 3 models × with / without the skill = 24 answers</text>

  <!-- scale: 0 at x=230, 10 at x=730 (50px per point) -->
  <g>
    <line class="grid" x1="230" y1="84" x2="230" y2="326"/>
    <line class="grid" x1="355" y1="84" x2="355" y2="326"/>
    <line class="grid" x1="480" y1="84" x2="480" y2="326"/>
    <line class="grid" x1="605" y1="84" x2="605" y2="326"/>
    <line class="grid" x1="730" y1="84" x2="730" y2="326"/>
    <text class="t s" x="226" y="344">0</text>
    <text class="t s" x="347" y="344">2.5</text>
    <text class="t s" x="476" y="344">5</text>
    <text class="t s" x="597" y="344">7.5</text>
    <text class="t s" x="722" y="344">10</text>
  </g>

  <!-- Haiku -->
  <text class="t lab" x="30" y="112">Haiku 5.5</text>
  <text class="t k" x="130" y="112">without</text>
  <rect x="230" y="98" width="200" height="20" rx="4" fill="#cbd5e1"/>
  <text class="t val" x="438" y="113">4.00</text>
  <text class="t k" x="130" y="138">with skill</text>
  <rect x="230" y="124" width="312.5" height="20" rx="4" fill="#0d9488"/>
  <text class="t val" x="550" y="139">6.25</text>

  <!-- Sonnet -->
  <text class="t lab" x="30" y="190">Sonnet 5.5</text>
  <text class="t k" x="130" y="190">without</text>
  <rect x="230" y="176" width="225" height="20" rx="4" fill="#cbd5e1"/>
  <text class="t val" x="463" y="191">4.50</text>
  <text class="t k" x="130" y="216">with skill</text>
  <rect x="230" y="202" width="400" height="20" rx="4" fill="#0d9488"/>
  <text class="t val" x="638" y="217">8.00</text>

  <!-- Opus -->
  <text class="t lab" x="30" y="268">Opus 5.5</text>
  <text class="t k" x="130" y="268">without</text>
  <rect x="230" y="254" width="300" height="20" rx="4" fill="#cbd5e1"/>
  <text class="t val" x="538" y="269">6.00</text>
  <text class="t k" x="130" y="294">with skill</text>
  <rect x="230" y="280" width="437.5" height="20" rx="4" fill="#0d9488"/>
  <text class="t val" x="675" y="295">8.75</text>

  <!-- Side summary -->
  <rect x="766" y="92" width="168" height="214" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text class="t k" x="782" y="118" font-weight="700">Rubric pass rate</text>
  <text class="t val" x="782" y="142" fill="#64748b">without 49%</text>
  <text class="t val" x="782" y="164" fill="#0f766e">with 95%</text>
  <text class="t k" x="782" y="196" font-weight="700">Avg rank (of 6)</text>
  <text class="t val" x="782" y="220" fill="#64748b">without 4.92</text>
  <text class="t val" x="782" y="242" fill="#0f766e">with 2.08</text>
  <text class="t k" x="782" y="274" font-weight="700">Wrong claims</text>
  <text class="t val" x="782" y="296" fill="#475569">6/72 → 5/72</text>

  <text class="t s" x="30" y="374">Skill won 12/12 same-model pairs. Fact accuracy unchanged → v0.4.1 adds timeline-first, status re-checks, source-conflict and derived-number rules.</text>
</svg>
