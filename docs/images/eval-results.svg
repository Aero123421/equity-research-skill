<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation results</title>
  <desc id="desc">Rubric pass rates. Iteration 1: with skill 93 percent, without skill 48 percent. Iteration 3 on the three hardest cases: 96 percent, up from 88 percent in iteration 2.</desc>
  <defs>
    <style>
      .t { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; fill: #1f2937; }
      .h1 { font-size: 20px; font-weight: 700; }
      .sub { font-size: 12.5px; fill: #64748b; }
      .lab { font-size: 13px; }
      .val { font-size: 13px; font-weight: 700; }
      .s { font-size: 11.5px; fill: #64748b; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="330" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="329" rx="16" fill="none" stroke="#e2e8f0"/>

  <text class="t h1" x="30" y="42">Evaluation: rubric pass rate</text>
  <text class="t sub" x="30" y="63">Same model (Sonnet) with web search, with vs without the skill; graded by a separate model against evals/rubric.md.</text>

  <!-- axis: 0% at x=300, 100% at x=880 (580px) -->
  <g>
    <line class="grid" x1="300" y1="84" x2="300" y2="292"/>
    <line class="grid" x1="445" y1="84" x2="445" y2="292"/>
    <line class="grid" x1="590" y1="84" x2="590" y2="292"/>
    <line class="grid" x1="735" y1="84" x2="735" y2="292"/>
    <line class="grid" x1="880" y1="84" x2="880" y2="292"/>
    <text class="t s" x="294" y="310">0%</text>
    <text class="t s" x="434" y="310">25%</text>
    <text class="t s" x="579" y="310">50%</text>
    <text class="t s" x="724" y="310">75%</text>
    <text class="t s" x="864" y="310">100%</text>
  </g>

  <text class="t lab" x="30" y="104" font-weight="700">Iteration 1 · 4 cases</text>
  <text class="t lab" x="46" y="128">without skill</text>
  <rect x="300" y="114" width="278" height="20" rx="4" fill="#cbd5e1"/>
  <text class="t val" x="586" y="129">48%</text>
  <text class="t lab" x="46" y="156">with skill (v0.1)</text>
  <rect x="300" y="142" width="539" height="20" rx="4" fill="#0d9488"/>
  <text class="t val" x="847" y="157">93%</text>

  <text class="t lab" x="30" y="196" font-weight="700">Hardest 3 cases (G1–G13)</text>
  <text class="t lab" x="46" y="220">with skill (v0.2)</text>
  <rect x="300" y="206" width="510" height="20" rx="4" fill="#5eead4"/>
  <text class="t val" x="818" y="221">88%</text>
  <text class="t lab" x="46" y="248">with skill (v0.3)</text>
  <rect x="300" y="234" width="557" height="20" rx="4" fill="#0d9488"/>
  <text class="t val" x="865" y="249">96%</text>

  <text class="t s" x="46" y="280">Cases: JP deep dive · US earnings · JP/US theme · US short squeeze (+ JP margin quick, US price move in v0.2)</text>
</svg>
